# aeb.conf - settings read by aeb at start (-c aeb.conf), they override the defaults
# reaction delay in seconds, used in safe distance = v * t_delay + v^2 / (2 * decel)
t_delay_s = 0.15
# 1 = after a stop, drive again by itself (at least 2 s in STOPPED and the path is clear)
auto_resume = 1
# motor driver pins (BCM GPIO numbers) - DO NOT CHANGE, these match the wiring
# forward = PWM on RPWM with LPWM held LOW, so swapping RPWM/LPWM makes the wheels turn backward
# front BTS7960 #1: RPWM GPIO12 (pin 32), LPWM GPIO22 (pin 15), EN GPIO23 (pin 16)
pin_front_rpwm = 12
pin_front_lpwm = 22
pin_front_en = 23
# rear BTS7960 #2: RPWM GPIO13 (pin 33), LPWM GPIO27 (pin 13), EN GPIO24 (pin 18)
pin_rear_rpwm = 13
pin_rear_lpwm = 27
pin_rear_en = 24
# which motor drivers run: 3 = both axles, 2 = REAR only (front driver kept OFF), 1 = front only
# set to 2 because the front driver ran the front wheels backward; set back to 3 after the front driver is fixed
motor_axles = 2
